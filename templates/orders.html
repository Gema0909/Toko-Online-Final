<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gema Store - Pesanan Saya</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/orders.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="brand">
                <i class="fas fa-shopping-bag"></i> Toko Online
            </div>
            <div class="nav-links">
                <span class="nav-greeting" id="user-greeting">Hi, Pelanggan</span>
                <a href="/produk" class="nav-link"><i class="fas fa-store"></i> Produk</a>
                <a href="/cart" class="nav-link cart-link">
                    <i class="fas fa-shopping-cart"></i> Keranjang
                    <span class="cart-badge" id="cart-badge" style="display: none;">0</span>
                </a>
                <a href="/orders" class="nav-link"><i class="fas fa-receipt"></i> Pesanan Saya</a>
                <a href="/logout" class="nav-link"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </div>
    </nav>

    <main class="main-container orders-container">
        <div class="page-header">
            <h2><i class="fas fa-receipt text-purple"></i> Pesanan Saya</h2>
            <p>Pantau status pengiriman paket pesanan fisik Anda di bawah ini.</p>
        </div>
        <div class="orders-list" id="tempat-pesanan">
            <p class="loading-text">Sedang memuat riwayat pesanan Anda...</p>
        </div>
    </main>

    <footer class="footer">
        &copy; 2026 Toko Online E-Commerce System. All Rights Reserved.
    </footer>

    <script src="/static/js/main.js"></script>
</body>
</html>
