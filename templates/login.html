<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gema Store - Login</title>
    <link rel="stylesheet" href="static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="brand">
                <i class="fas fa-shopping-bag"></i> Toko Online
            </div>
            <div class="nav-links">
                <a href="shop.html" class="nav-link"><i class="fas fa-store"></i> Produk</a>
                <a href="register.html" class="nav-link text-green"><i class="fas fa-user-plus"></i> Daftar</a>
            </div>
        </div>
    </nav>

    <main class="main-container">
        <div class="login-wrapper">
            <div class="login-card">
                <div class="card-gradient-line"></div>
                
                <div class="card-header">
                    <div class="icon-circle">
                        <i class="fas fa-user-circle"></i>
                    </div>
                    <h2>Selamat Datang!</h2>
                    <p>Silakan masuk untuk mulai berbelanja dan mengelola keranjang.</p>
                </div>

                <div class="card-body">
                    <form id="loginForm">
                        <div class="form-group">
                            <label>Username</label>
                            <div class="input-wrapper">
                                <i class="fas fa-user input-icon"></i>
                                <input type="text" name="username" placeholder="Masukkan username Anda" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Password</label>
                            <div class="input-wrapper">
                                <i class="fas fa-lock input-icon"></i>
                                <input type="password" name="password" id="passwordInput" placeholder="••••••••" required>
                                <button type="button" class="toggle-btn" onclick="togglePassword()">
                                    <i class="fas fa-eye" id="eyeIcon"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="btn-primary">
                            Masuk Akun <i class="fas fa-sign-in-alt"></i>
                        </button>
                    </form>

                    <div class="card-footer">
                        <p>Belum terdaftar sebagai pelanggan? <br>
                            <a href="register.html" class="link-register">Daftar Akun Baru</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <script src="static/js/main.js"></script>
</body>
</html>
