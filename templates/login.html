{% extends "base.html" %}

{% block content %}
<div class="flex items-center justify-center min-h-[80vh]">
    <div class="w-full max-w-md bg-gray-800 rounded-2xl shadow-2xl border border-gray-700 overflow-hidden relative">
        
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-500 via-indigo-500 to-purple-500"></div>

        <div class="bg-gray-900/50 p-6 text-center border-b border-gray-700">
            <div class="inline-block p-3 rounded-full bg-gray-800 border border-gray-600 mb-3 shadow-inner">
                <i class="fas fa-user-circle text-4xl text-blue-500"></i>
            </div>
            <h2 class="text-2xl font-bold text-white">Selamat Datang!</h2>
            <p class="text-sm text-gray-400 mt-1">Silakan masuk untuk mulai berbelanja dan mengelola keranjang.</p>
        </div>

        <div class="p-8">
            <form method="POST" action="{{ url_for('login') }}" class="space-y-6">
                
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Username</label>
                    <div class="relative rounded-md shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-user text-gray-500"></i>
                        </div>
                        <input type="text" name="username" required 
                            class="w-full bg-gray-900 text-white pl-10 pr-4 py-3 rounded-lg border border-gray-600 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition placeholder-gray-600" 
                            placeholder="Masukkan username Anda">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Password</label>
                    <div class="relative rounded-md shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-lock text-gray-500"></i>
                        </div>
                        <input type="password" name="password" id="passwordInput" required 
                            class="w-full bg-gray-900 text-white pl-10 pr-12 py-3 rounded-lg border border-gray-600 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition placeholder-gray-600" 
                            placeholder="••••••••">
                        
                        <div class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer" onclick="togglePassword()">
                            <i class="fas fa-eye text-gray-500 hover:text-blue-400 transition" id="eyeIcon" title="Lihat Password"></i>
                        </div>
                    </div>
                </div>

                <button type="submit" 
                    class="w-full bg-gradient-to-r from-blue-600 to-indigo-700 hover:from-blue-500 hover:to-indigo-600 text-white font-bold py-3 rounded-lg shadow-lg transform transition hover:-translate-y-0.5 active:translate-y-0 duration-200 uppercase tracking-wide">
                    Masuk Akun <i class="fas fa-sign-in-alt ml-2"></i>
                </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-sm text-gray-400">
                    Belum terdaftar sebagai pelanggan? 
                    <a href="{{ url_for('register') }}" class="text-blue-400 hover:text-blue-300 font-bold hover:underline transition">
                        Daftar Akun Baru
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>

<script>
    function togglePassword() {
        const passwordInput = document.getElementById('passwordInput');
        const eyeIcon = document.getElementById('eyeIcon');
        
        // Cek tipe input, jika password ubah ke text, jika text ubah ke password
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            eyeIcon.classList.remove('fa-eye');
            eyeIcon.classList.add('fa-eye-slash'); // Mengubah ikon jadi mata dicoret
        } else {
            passwordInput.type = 'password';
            eyeIcon.classList.remove('fa-eye-slash');
            eyeIcon.classList.add('fa-eye'); // Mengembalikan ikon mata normal
        }
    }
</script>
{% endblock %}
