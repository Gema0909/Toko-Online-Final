<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gema Store - Login</title>
    <link rel="stylesheet" href="/static/css/style.css?v=1.1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="brand">
                <a href="/" style="text-decoration: none; color: inherit;">
                    <i class="fas fa-lock"></i> Toko Online
                </a>
            </div>
            
            <div class="nav-links">
                <a href="/" class="nav-link"><i class="fas fa-home"></i> Home</a>
                
                <a href="/produk" class="nav-link">Produk</a>
                <a href="/register" class="nav-link btn-daftar">Daftar</a>
            </div>
        </div>
    </nav>

    <main class="main-container">
        <div class="login-wrapper">
            <div class="login-card">
                <div class="card-gradient-line"></div>
                
                <div class="card-header">
                    <div class="icon-circle">
                        <i class="fas fa-user-circle"></i>
                    </div>
                    <h2>Selamat Datang!</h2>
                    <p>Silakan masuk untuk mulai berbelanja dan mengelola keranjang.</p>
                </div>

                <div class="card-body">
                    <form id="loginForm">
                        <div class="form-group">
                            <label>Username</label>
                            <div class="input-wrapper">
                                <i class="fas fa-user input-icon"></i>
                                <input type="text" name="username" id="username" placeholder="Masukkan username Anda" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Password</label>
                            <div class="input-wrapper">
                                <i class="fas fa-lock input-icon"></i>
                                <input type="password" name="password" id="password" placeholder="••••••••" required>
                                <button type="button" class="toggle-btn" id="btnTogglePassword">
                                    <i class="fas fa-eye" id="eyeIcon"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="btn-primary">
                            Masuk Akun <i class="fas fa-sign-in-alt"></i>
                        </button>
                    </form>

                    <div class="card-footer">
                        <p>Belum terdaftar sebagai pelanggan? <br>
                            <a href="/register" class="link-register">Daftar Akun Baru</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <script src="/static/js/login.js"></script>
</body>
</html>
