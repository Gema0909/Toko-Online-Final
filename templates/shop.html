<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gema Store - Katalog Produk</title>
    <link rel="stylesheet" href="static/css/style.cssv=1001">
    <link rel="stylesheet" href="static/css/shop.cssv=1001">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="brand">
                <i class="fas fa-shopping-bag"></i> Toko Online
            </div>
            <div class="nav-links">
                <span class="nav-greeting" id="user-greeting"><i class="fas fa-user-circle"></i> Hi, Pelanggan</span>
                <a href="/produk" class="nav-link text-blue"><i class="fas fa-store"></i> Produk</a>
                <a href="/cart" class="nav-link cart-link">
                    <i class="fas fa-shopping-cart"></i> Keranjang
                    <span class="cart-badge" id="cart-badge" style="display: none;">0</span>
                </a>
                <a href="/orders" class="nav-link text-purple"><i class="fas fa-receipt"></i> Pesanan Saya</a>
                <a href="/logout" class="nav-link"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </div>
    </nav>

    <main class="main-container shop-container">
        
        <div class="shop-banner">
            <i class="fas fa-tags banner-icon icon-left"></i>
            <i class="fas fa-box-open banner-icon icon-right"></i>
            
            <h1 class="banner-title">KATALOG PRODUK</h1>
            <p class="banner-subtitle">Temukan barang impianmu dengan harga terbaik di sini!</p>
        </div>

        <div id="tempat-produk" class="product-grid">
            <p class="loading-text">Sedang memuat produk dari database...</p>
        </div>

    </main>

    <footer class="footer">
        &copy; 2026 Toko Online E-Commerce System. All Rights Reserved.
    </footer>

    <script src="/static/js/main.js"></script>
    <script src="/static/js/shop.js"></script>
</body>
</html>
