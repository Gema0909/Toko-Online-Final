<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gema Store - Keranjang Belanja</title>
    <link rel="stylesheet" href="/static/css/style.css?v=999">
    <link rel="stylesheet" href="/static/css/cart.css?v=999"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="brand">
                <i class="fas fa-shopping-bag"></i> Toko Online
            </div>
            <div class="nav-links">
                <span class="nav-greeting" id="user-greeting">Hi, Pelanggan</span>
                <a href="/produk" class="nav-link"><i class="fas fa-store"></i> Produk</a>
                <a href="/cart" class="nav-link cart-link">
                    <i class="fas fa-shopping-cart"></i> Keranjang
                    <span class="cart-badge">0</span>
                </a>
                <a href="/orders" class="nav-link"><i class="fas fa-receipt"></i> Pesanan Saya</a>
                <a href="/logout" class="nav-link"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </div>
    </nav>

    <main class="main-container cart-container">
        <div class="cart-header">
            <h2><i class="fas fa-shopping-cart text-green"></i> Keranjang Belanja</h2>
        </div>

        <div class="cart-grid">
            <div class="cart-items-wrapper">
                <table class="cart-table">
                    <thead>
                        <tr>
                            <th>Produk</th>
                            <th class="text-center">Jumlah</th>
                            <th class="text-right">Subtotal</th>
                            <th class="text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="cart-items-container"></tbody>
                </table>
            </div>

            <div class="cart-summary-wrapper">
                <h3 class="summary-title">Ringkasan Belanja</h3>
                <div class="summary-total">
                    <p>Total Harga: <span id="cart-total-price">Rp 0</span></p>
                </div>

                <form id="checkoutForm" class="checkout-form" enctype="multipart/form-data">
                    <div class="form-group">
                        <label>Alamat Pengiriman</label>
                        <textarea name="address" required rows="3" placeholder="Masukkan alamat lengkap rumah Anda"></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label>Metode Pembayaran</label>
                        <select id="payment_method" name="payment_method" required>
                            <option value="">-- Pilih Metode --</option>
                            <option value="BCA">Transfer BCA</option>
                            <option value="BRI">Transfer BRI</option>
                            <option value="Mandiri">Transfer Mandiri</option>
                            <option value="QRIS">QRIS</option>
                            <option value="COD">COD (Bayar di Tempat)</option>
                        </select>

                        <div id="payment_info" class="payment-info hidden">
                            <div class="form-group mb-2" id="proof_div">
                                <label>Upload Bukti Pembayaran</label>
                                <input type="file" id="payment_proof" name="payment_proof" accept=".jpg,.jpeg,.png" class="dark-file-input">
                            </div>
                            <h4 class="text-green font-bold">Informasi Pembayaran</h4>
                            <p id="payment_text" class="payment-text-desc"></p>
                            <img id="qris_image" src="/static/img/qris.jpg" alt="QRIS Gema Store" class="hidden" style="width: 100%; height: auto; margin-top: 15px; border-radius: 8px; display: block;">
                        </div>
                    </div>

                    <button type="submit" class="btn-checkout mt-4">
                        <i class="fas fa-check-circle"></i> Buat Pesanan Sekarang
                    </button>
                </form>
            </div>
        </div>
    </main>

    <footer class="footer">
        &copy; 2026 Toko Online E-Commerce System. All Rights Reserved.
    </footer>

    <script src="/static/js/main.js"></script>
    <script src="/static/js/cart.js"></script>
</body>
</html>
