<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gema Store - Register</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="brand">
                <i class="fas fa-shopping-bag"></i> Toko Online
            </div>
            <div class="nav-links">
                <a href="/" class="nav-link"><i class="fas fa-store"></i> Produk</a>
                <a href="/login" class="nav-link"><i class="fas fa-sign-in-alt"></i> Masuk</a>
            </div>
        </div>
    </nav>

    <main class="main-container">
        <div class="login-wrapper">
            <div class="login-card">
                
                <div class="card-gradient-line card-gradient-green"></div>

                <div class="card-header">
                    <div class="icon-circle icon-green">
                        <i class="fas fa-user-plus"></i>
                    </div>
                    <h2>Buat Akun Baru</h2>
                    <p>Daftar sekarang untuk kemudahan transaksi pengiriman barang belanjaan Anda.</p>
                </div>

                <div class="card-body">
                    <form id="registerForm">
                        
                        <div class="form-group">
                            <label>Username Baru</label>
                            <div class="input-wrapper">
                                <i class="fas fa-user-tag input-icon"></i>
                                <input type="text" name="username" placeholder="Pilih username unik Anda" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Password</label>
                            <div class="input-wrapper">
                                <i class="fas fa-key input-icon"></i>
                                <input type="password" name="password" id="passwordInput" placeholder="Buat kata sandi aman" required>
                                <button type="button" class="toggle-btn" onclick="togglePassword()" title="Lihat Password">
                                    <i class="fas fa-eye" id="eyeIcon"></i>
                                </button>
                            </div>
                            <p class="form-hint">*Disarankan menggunakan minimal 3 karakter.</p>
                        </div>

                        <button type="submit" class="btn-primary btn-green">
                            Daftar Sekarang <i class="fas fa-paper-plane"></i>
                        </button>
                    </form>

                    <div class="card-footer">
                        <p>Sudah terdaftar sebagai member? <br>
                            <a href="/login" class="login-link link-green">Masuk di Sini</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <footer class="footer">
        &copy; 2026 Toko Online E-Commerce System. All Rights Reserved.
    </footer>

    <script src="/static/js/main.js"></script>
</body>
</html>
